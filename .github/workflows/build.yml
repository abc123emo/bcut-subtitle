name: Build Windows EXE

on:
  push:
    branches: [main, master]
  workflow_dispatch: # 支持在 GitHub 网页上手动点击触发

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: python -m pip install --upgrade pyinstaller

      - name: Build exe
        run: python -m PyInstaller --clean --noconfirm --onefile --name bcut_subtitle bcut_subtitle.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bcut_subtitle-windows
          path: dist/bcut_subtitle.exe
          if-no-files-found: error

      - name: Publish release (latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: bcut_subtitle（最新版）
          files: dist/bcut_subtitle.exe
          make_latest: true
